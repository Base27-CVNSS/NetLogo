name: Deploy ABM GIS to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "abmgis/**"
      - ".github/workflows/pages-abmgis.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-abmgis"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload ABM GIS site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./abmgis
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
